version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funding_intelligence_app
    ports:
      - "3838:3838"
    volumes:
      # Mantém a base de dados SQLite persistida no host
      - ./funding_intelligence.sqlite:/app/funding_intelligence.sqlite
      # Mapeia logs e exportações para o host para fácil monitoramento e acesso
      - ./logs:/app/logs
      - ./data_exports:/app/data_exports
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BLUESMINDS_API_KEY=${BLUESMINDS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GDRIVE_SERVICE_ACCOUNT_JSON=${GDRIVE_SERVICE_ACCOUNT_JSON}
      - GDRIVE_SERVICE_ACCOUNT_CONTENT=${GDRIVE_SERVICE_ACCOUNT_CONTENT}
      - GDRIVE_FILE_ID=${GDRIVE_FILE_ID}
      # PostgreSQL (opcional - se não configurado, usa SQLite)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3838/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
