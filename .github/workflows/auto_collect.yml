name: 🔄 Busca Automática de Editais

on:
  schedule:
    # 0 3 * * 1 = Toda segunda-feira às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permite disparo manual com 1 clique na aba Actions do GitHub

concurrency:
  group: auto-collect-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: 🚀 Coletar e Atualizar Oportunidades
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 📥 Clonar repositório (branch feat-fix-new-fontes)
        uses: actions/checkout@v4
        with:
          ref: feat-fix-new-fontes
          fetch-depth: 0

      - name: ⚙️ Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpoppler-cpp-dev \
            libpq-dev \
            sqlite3 \
            libsqlite3-dev \
            libicu-dev

      - name: 📦 Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: 📚 Instalar pacotes R essenciais
        run: |
          Rscript -e "
            repos <- getOption('repos');
            if (is.null(repos) || is.na(repos['CRAN']) || repos['CRAN'] == '@CRAN@') {
              distro <- tryCatch(system('lsb_release -cs', intern = TRUE), error = function(e) 'noble');
              options(repos = c(CRAN = paste0('https://packagemanager.posit.co/cran/__linux__/', distro, '/latest')));
            }
            pkgs <- c(
              'DBI', 'RSQLite', 'jsonlite', 'digest', 'dplyr', 'purrr',
              'stringr', 'stringi', 'httr', 'httr2', 'rvest', 'xml2', 'lubridate', 'tibble',
              'readr', 'writexl', 'callr', 'ratelimitr', 'uuid', 'memoise',
              'RPostgres'
            );
            # Instala apenas os pacotes que ainda não estiverem disponíveis
            missing_pkgs <- pkgs[!pkgs %in% installed.packages()[, 'Package']];
            if (length(missing_pkgs) > 0) {
              install.packages(missing_pkgs, dependencies = TRUE);
            }
            # Validação obrigatória de carregamento das bibliotecas C/C++ compartilhadas
            for (p in c('stringi', 'stringr', 'DBI', 'RSQLite', 'RPostgres', 'rvest')) {
              library(p, character.only = TRUE);
            }
            message('Dependências R verificadas e carregadas com sucesso.');
          "

      - name: 🔍 Executar Busca Automática de Editais
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.jsystdrhtcoopjkrcwql:1vYLfc1not1S4iTA@aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-1.5-flash' }}
        run: |
          Rscript tools/auto_collect.R

      - name: 💾 Commit & Push dos dados atualizados na feat-fix-new-fontes e main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f funding_intelligence.sqlite data_exports/ logs/ || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos arquivos locais detectada nesta rodada."
          else
            git commit -m "chore(auto-collect): atualização automática de editais [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase -X theirs origin feat-fix-new-fontes || git pull --rebase origin feat-fix-new-fontes || true
            git push origin HEAD:feat-fix-new-fontes
            # Mantém também a branch main sincronizada com o banco e exportações recentes
            git pull --rebase -X theirs origin main || git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: 📦 Salvar Banco de Dados e Exportações como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-intelligence-data
          path: |
            funding_intelligence.sqlite
            data_exports/
            logs/
          retention-days: 14
